name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOFLAGS: -mod=readonly

jobs:
  quality:
    name: Quality (fmt, vet, tidy, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy (no diff)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go mod verify
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test
        run: go test -race -cover ./...

      - name: Build dots
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-X main.version=ci-${GITHUB_SHA::7}" -o "$RUNNER_TEMP/dots${ext}" ./cmd/dots

      - name: Smoke E2E
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          bash .github/scripts/smoke.sh "$RUNNER_TEMP/dots${ext}"

      # Interactive prompts need a pty: drive them with expect (Linux/macOS).
      # macOS ships /usr/bin/expect; Ubuntu runners usually have it too.
      - name: Install expect
        if: runner.os == 'Linux'
        run: command -v expect >/dev/null || { sudo apt-get update && sudo apt-get install -y expect; }

      - name: TTY E2E (expect)
        if: runner.os != 'Windows'
        run: bash .github/scripts/tty-e2e.sh "$RUNNER_TEMP/dots"

  # FreeBSD and OpenBSD run in QEMU VMs on an Ubuntu runner. They are slower
  # and occasionally flaky, so no other job depends on them (never in `needs`).
  # Go comes from the OS package; if it is older than go.mod's requirement,
  # Go's toolchain auto-switch (GOTOOLCHAIN=auto, needs network) fetches a
  # newer one from go.dev, which publishes freebsd/openbsd toolchains.
  test-freebsd:
    name: Test (FreeBSD 15.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          copyback: false
          prepare: |
            pkg install -y go bash
          run: |
            export GOTOOLCHAIN=auto
            go version
            go test ./...
            go build -trimpath -o dots-ci ./cmd/dots
            bash .github/scripts/smoke.sh ./dots-ci

  test-openbsd:
    name: Test (OpenBSD 7.9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Test in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          copyback: false
          prepare: |
            pkg_add go bash
          run: |
            export GOTOOLCHAIN=auto
            go version
            go test ./...
            go build -trimpath -o dots-ci ./cmd/dots
            bash .github/scripts/smoke.sh ./dots-ci

  test-min-go:
    name: Test (minimum Go 1.24, ${{ matrix.os }})
    # macOS is included because binaries linked by older Go releases fail to
    # start on recent macOS (dyld: missing LC_UUID load command). Go 1.24 is
    # the first release that links darwin binaries with LC_UUID by default.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Never auto-upgrade: the point is to compile with the oldest supported Go.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (minimum supported)
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Test
        run: go test ./...

      - name: Smoke test (real binary)
        run: |
          go build -o "$RUNNER_TEMP/dots" ./cmd/dots
          bash .github/scripts/smoke.sh "$RUNNER_TEMP/dots"

  cross-compile:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ quality, test ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: 386 }
          - { goos: linux, goarch: arm }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: freebsd, goarch: riscv64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: openbsd, goarch: arm64 }
          - { goos: openbsd, goarch: riscv64 }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""; if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/dots-${GOOS}-${GOARCH}${ext}" ./cmd/dots
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dots-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

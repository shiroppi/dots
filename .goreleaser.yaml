# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration. Docs: https://goreleaser.com
version: 2

project_name: dots

builds:
  - id: dots
    main: ./cmd/dots
    binary: dots
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Keep in sync with the cross-compile matrix in .github/workflows/ci.yml.
    targets:
      - windows_amd64
      - windows_arm64
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - linux_riscv64
      - linux_386
      - linux_arm_7
      - freebsd_amd64
      - freebsd_arm64
      - freebsd_riscv64
      - openbsd_amd64
      - openbsd_arm64
      - openbsd_riscv64

archives:
  - id: dots
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^Merge '

release:
  github:
    owner: shiroppi
    name: dots
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"
